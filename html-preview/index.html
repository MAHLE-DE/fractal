<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Standards Cascade</title
  ><link rel="stylesheet" href="./style.css" />
  <script src="./config.js"></script>
  <canvas id="scene"></canvas
  ><canvas id="labels"></canvas>
  <header>
    <div class="brand">
      <span id="date"></span>
      <h1>Standards <em>Cascade</em></h1>
    </div>
    <div class="search-wrap">
      <div class="search-box">
        <span>⌕</span
        ><input
          id="search"
          role="combobox"
          aria-controls="results"
          aria-expanded="false"
          aria-autocomplete="list"
          placeholder="Find standards, topics, legacy codes…"
          autocomplete="off"
        /><kbd>/</kbd>
      </div>
      <div id="results" role="listbox" hidden></div>
    </div>
    <div class="tools">
      <button id="theme">☼ Theme</button>
    </div>
  </header>
  <nav id="trail" aria-label="Navigation history" hidden>
    <button id="back" title="Back (Backspace)">← Back</button>
    <div id="breadcrumbs"></div>
  </nav>
  <aside id="panel" aria-live="polite"></aside>
  <div id="opening">
    <small>THE KNOWLEDGE BEHIND EVERY DECISION</small>
    <h2>A constellation of standards.</h2>
    <p id="opening-count"></p>
    <button id="skip">Skip introduction →</button>
  </div>
  <div id="overview-note">
    <small>THE ATLAS</small>
    <h2>Follow a thread.<br />Discover what depends on it.</h2>
    <p>Choose a standard to bring its connections into view.</p>
  </div>
  <footer>
    <div id="legend"></div>
    <div>
      <button id="overview">↙ Overview</button><span>Scroll to zoom</span>
    </div>
  </footer>
  <div id="toast" role="status"></div>
  <script src="./cascade.js"></script>
</html>
